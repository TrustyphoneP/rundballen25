{% load static %}
<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e4c59">
  <title>{% block title %}Rundballen{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}?v=2">
  <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}?v=2">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            p:   { DEFAULT:'#1e4c59', light:'#2a6275', dark:'#122f38', pale:'#3a7a8f' },
            acc: { DEFAULT:'#e8a444', dim:'rgba(232,164,68,0.15)', brd:'rgba(232,164,68,0.28)' },
            ok:  '#4caf7d',
            warn:'#e07b54',
          },
          fontFamily: {
            display: ['"DM Serif Display"','serif'],
            mono:    ['"DM Mono"','monospace'],
            sans:    ['Outfit','sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-weight: 350; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    input, textarea {
      background: rgba(255,255,255,0.06) !important;
      border: 1px solid rgba(255,255,255,0.14) !important;
      color: #f0ede8 !important;
      border-radius: 10px !important;
      padding: 10px 12px !important;
      width: 100%;
      font-size: 16px;   /* verhindert iOS-Zoom */
      font-family: 'Outfit', sans-serif;
    }
    input:focus, textarea:focus {
      outline: none; border-color: #e8a444 !important;
      box-shadow: 0 0 0 2px rgba(232,164,68,0.25);
    }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(240,237,232,0.09); border-radius: 12px; }
    .section-mono { font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 0.18em;
                    text-transform: uppercase; color: rgba(240,237,232,0.4); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
           padding: 10px 16px; border-radius: 10px; font-size: 0.82rem; font-weight: 500;
           cursor: pointer; border: 1px solid transparent; font-family: 'Outfit', sans-serif;
           transition: all 0.15s; text-decoration: none; white-space: nowrap; width: 100%; }
    .btn-primary { background: #e8a444; color: #122f38; }
    .btn-primary:hover { background: #f2c27a; }
    .btn-ghost { background: rgba(255,255,255,0.05); border-color: rgba(240,237,232,0.1); color: rgba(240,237,232,0.8); }
    .btn-ghost:hover { background: rgba(255,255,255,0.09); }
    .btn-danger { background: rgba(224,123,84,0.15); border-color: rgba(224,123,84,0.35); color: #e07b54; }
    .btn-danger:hover { background: rgba(224,123,84,0.25); }
    .badge { display: inline-flex; align-items: center; font-family: 'DM Mono', monospace;
             font-size: 0.58rem; padding: 2px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
    .badge-warn { color: #e07b54; border-color: rgba(224,123,84,0.35); background: rgba(224,123,84,0.1); }
    .badge-ok   { color: #4caf7d; border-color: rgba(76,175,125,0.35); background: rgba(76,175,125,0.1); }
    .badge-acc  { color: #e8a444; border-color: rgba(232,164,68,0.3);  background: rgba(232,164,68,0.1); }
    .badge-muted{ color: rgba(240,237,232,0.45); border-color: rgba(240,237,232,0.12); background: transparent; }
    .flash { padding: 10px 16px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 16px; border: 1px solid; }
    .flash-success { background: rgba(76,175,125,0.1); border-color: rgba(76,175,125,0.3); color: #4caf7d; }
    .flash-warning { background: rgba(224,123,84,0.1); border-color: rgba(224,123,84,0.3); color: #e07b54; }
    .flash-error   { background: rgba(224,123,84,0.15); border-color: rgba(224,123,84,0.4); color: #e07b54; }
    .flash-info    { background: rgba(58,122,143,0.15); border-color: rgba(58,122,143,0.4); color: #7fb6c9; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-p-dark text-[#f0ede8] font-sans antialiased">

  <div class="mx-auto max-w-lg min-h-full flex flex-col">

    <!-- Kopf -->
    <header class="sticky top-0 z-20 bg-p-dark/90 backdrop-blur border-b border-white/10
                   px-4 pt-[env(safe-area-inset-top)]">
      <div class="flex items-center justify-between h-14">
        <span class="font-display text-xl tracking-wide">
          {% block header_title %}rund<span class="text-acc">Ballen</span>{% endblock %}
        </span>
        {% block header_right %}{% endblock %}
      </div>
    </header>

    <!-- Inhalt -->
    <main class="flex-1 px-4 py-6 pb-[calc(24px+env(safe-area-inset-bottom))]">
      {% block content %}{% endblock %}
    </main>

  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
